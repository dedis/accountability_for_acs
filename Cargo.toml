[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ed-on-bn254 = "0.5"
ark-ff = "0.5"
ark-std = "0.5"
clap = { version = "4", features = ["derive", "env"] }
light-poseidon = "0.4"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
babyjub = { path = "crates/babyjub" }
bench-core = { path = "crates/bench-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
