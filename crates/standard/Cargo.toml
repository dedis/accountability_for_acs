[package]
name = "standard"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Longfellow (Google Benchmark) prove-verify benchmarks for the credential presentation proof"

[features]
default = ["pq"]
# The signature features are forwarded to pqc, whose signer
# (pqc::sig::Selected) standard_signature times.
pq = ["dep:pqc"]
# Signature scheme of standard_signature: ML-DSA by default, SLH-DSA with
# this feature.
slh-dsa = ["pq", "pqc/slh-dsa"]
# NIST security category of standard_signature: 3 by default, 5 with this
# feature.
level-5 = ["pq", "pqc/level-5"]
# SLH-DSA variant: small signatures (s) by default, fast signing (f) with this
# feature.
slh-dsa-f = ["slh-dsa", "pqc/slh-dsa-f"]

[[bin]]
name = "standard_signature"
required-features = ["pq"]

[[bin]]
name = "standard_pq_prove_verify"
required-features = ["pq"]

[[bin]]
name = "standard_pq_prove_verify_no_cft"
required-features = ["pq"]

[dependencies]
anyhow.workspace = true
bench-core.workspace = true
clap.workspace = true
regex.workspace = true
pqc = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
