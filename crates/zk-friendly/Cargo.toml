[package]
name = "zk-friendly"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Circom / Groth16 prove-verify benchmarks for the credential presentation proof, and its post-quantum credential model"

[features]
default = ["pq"]
# Post-quantum credential model (src/pq): SHAKE256, the signature chosen at
# compile time and threshold Module-LWE encryption (crate pqc). The
# Circom/Groth16 benchmarks cannot prove it and stop with an error.
pq = ["dep:pqc"]
# Issuer and C4 signature under pq: ML-DSA by default, SLH-DSA with this
# feature.
slh-dsa = ["pq", "pqc/slh-dsa"]
# NIST security category (signature, digest length, Module-LWE parameters):
# 3 by default, 5 with this feature.
level-5 = ["pq", "pqc/level-5"]
# SLH-DSA variant: small signatures (s) by default, fast signing (f) with this
# feature.
slh-dsa-f = ["slh-dsa", "pqc/slh-dsa-f"]

[dependencies]
anyhow.workspace = true
ark-bn254.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-std.workspace = true
babyjub.workspace = true
bench-core.workspace = true
clap.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
pqc = { workspace = true, optional = true }
