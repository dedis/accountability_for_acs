[package]
name = "revocation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "CFT anonymity-revocation benchmarks: ElGamal over Baby Jubjub, or threshold Module-LWE under pq"

[features]
default = ["pq"]
# Post-quantum CFT (src/lwe_cft.rs): threshold Module-LWE encryption and the
# signature chosen at compile time (pqc::sig::Selected).
pq = ["dep:pqc"]
# Signature of C4 under pq: ML-DSA by default, SLH-DSA with this feature.
slh-dsa = ["pq", "pqc/slh-dsa"]
# NIST security category (signature, digest length and Module-LWE
# parameters): 3 by default, 5 with this feature.
level-5 = ["pq", "pqc/level-5"]
# SLH-DSA variant: small signatures (s) by default, fast signing (f) with this
# feature.
slh-dsa-f = ["slh-dsa", "pqc/slh-dsa-f"]

[dependencies]
anyhow.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
babyjub.workspace = true
bench-core.workspace = true
rand.workspace = true
regex.workspace = true
clap.workspace = true
pqc = { workspace = true, optional = true }
zeroize.workspace = true

[[bin]]
name = "revocation_lwe_mpc"
required-features = ["pq"]
