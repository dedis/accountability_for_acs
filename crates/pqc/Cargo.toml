[package]
name = "pqc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Post-quantum primitives of the stacks: SHAKE256, ML-DSA and SLH-DSA, threshold Module-LWE encryption"

[features]
# The signature and the NIST security category, chosen at compile time
# (src/sig.rs). level-5 also sets the digest length (src/shake.rs) and the
# Module-LWE parameters (src/lwe.rs).
slh-dsa = []
level-5 = []
slh-dsa-f = ["slh-dsa"]

[dependencies]
anyhow.workspace = true
rand.workspace = true
sha3.workspace = true
fips204.workspace = true
fips205.workspace = true
zeroize.workspace = true
